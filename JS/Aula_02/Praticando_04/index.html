
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Praticando 4 - Manipulações</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">

        <h1>Praticando 4 - Manipulações</h1>

        <div class="row mt-3">

            <!-- Lado -->
            <div class="col-md-3">
                <h6>Lado</h6>

                <div class="btn-group">
                    <button class="btn btn-primary" id="esquerdo">
                        Esquerdo
                    </button>

                    <button class="btn btn-outline-primary" id="direito">
                        Direito
                    </button>
                </div>
            </div>

            <!-- Parágrafos -->
            <div class="col-md-6">
                <h6>Parágrafos</h6>

                <div class="botoes">
                    <button class="btn btn-primary" id="adicionarP">
                        Adicionar
                    </button>

                    <button class="btn btn-primary" id="removerPrimeiro">
                        Remover primeiro
                    </button>

                    <button class="btn btn-primary" id="removerUltimo">
                        Remover último
                    </button>

                    <button class="btn btn-primary" id="removerTodosP">
                        Remover todos
                    </button>
                </div>
            </div>

            <!-- Imagens -->
            <div class="col-md-3">
                <h6>Imagens</h6>

                <div class="botoes">
                    <button class="btn btn-primary" id="adicionarI">
                        Adicionar
                    </button>

                    <button class="btn btn-primary" id="removerUma">
                        Remover uma
                    </button>

                    <button class="btn btn-primary" id="removerTodasI">
                        Remover todas
                    </button>
                </div>
            </div>

        </div>

        <!-- Área dos parágrafos e imagens -->
        <div id="conteudo">

            <div id="paragrafos"></div>

            <div id="imagens"></div>

        </div>

    </div>

    <script src="js/js.js"></script>

</body>
</html>
