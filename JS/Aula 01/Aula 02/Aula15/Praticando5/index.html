
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Praticando 5 - Mini-game JS</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="container">

        <h1>Praticando 5 - Mini-game JS</h1>

        <h3>Instruções:</h3>

        <ol>
            <li>Clique em um dos quadrados coloridos</li>

            <li>
                Depois use as teclas
                <span>W</span>
                <span>A</span>
                <span>S</span>
                <span>D</span>
                para movimentar os elementos para cima, esquerda, baixo e direita respectivamente.
            </li>
        </ol>

        <!-- Teclados -->
        <div class="teclados">

            <!-- Setas -->
            <div class="grupo-teclas">

                <div class="tecla vazia"></div>
                <div class="tecla">↑</div>
                <div class="tecla vazia"></div>

                <div class="tecla">←</div>
                <div class="tecla">↓</div>
                <div class="tecla">→</div>

            </div>

            <!-- WASD -->
            <div class="grupo-teclas">

                <div class="tecla vazia"></div>
                <div class="tecla">W</div>
                <div class="tecla vazia"></div>

                <div class="tecla">A</div>
                <div class="tecla">S</div>
                <div class="tecla">D</div>

            </div>

        </div>

        <!-- Quadrados -->
        <div class="quadrados">

            <div class="quadrado vermelho"></div>

            <div class="quadrado azul"></div>

            <div class="quadrado verde"></div>

        </div>

    </main>

    <script src="js/js.js"></script>

</body>
</html>
